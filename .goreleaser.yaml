version: 2

project_name: daiku

before:
  hooks:
    - go mod verify
    - go test ./...

builds:
  - id: daiku
    main: ./cmd/daiku
    binary: daiku
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: daiku
    ids: [daiku]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive
    documents:
      - "${artifact}.spdx.sbom.json"

signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    artifacts: checksum
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}

release:
  draft: true
  prerelease: auto
  mode: replace
  header: |
    Automated draft generated from commit {{ .FullCommit }}.
    Verify `checksums.txt` with its Sigstore signature before installing.

changelog:
  use: git

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
