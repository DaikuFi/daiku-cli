name: Draft release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: How to increase the version when one is not given explicitly
        required: false
        default: auto
        type: choice
        options: [auto, patch, minor, major]
      prerelease:
        description: Prerelease identifier such as rc, leave empty for a stable release
        required: false
        default: ""
        type: string
      version:
        description: Exact version to release, overriding bump (for example v1.2.0)
        required: false
        default: ""
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  GOTOOLCHAIN: local

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.7"
          cache-dependency-path: go.sum
      # An explicit version wins; otherwise it is derived from the conventional
      # commits since the latest stable tag. Either way the release stays a
      # draft, so a human still promotes it.
      - name: Resolve release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            scripts/install/daiku.sh --validate-release-version "$INPUT_VERSION" ||
              { echo "invalid version: $INPUT_VERSION" >&2; exit 1; }
            if git rev-parse -q --verify "refs/tags/$INPUT_VERSION" >/dev/null; then
              echo "tag $INPUT_VERSION already exists" >&2
              exit 1
            fi
            version=$INPUT_VERSION
          elif [ -n "$PRERELEASE" ]; then
            version=$(scripts/release/version.sh --bump "$BUMP" --prerelease "$PRERELEASE")
          else
            version=$(scripts/release/version.sh --bump "$BUMP")
          fi
          echo "Releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # GoReleaser requires the tag to exist and to point at the commit being
      # built, so the tag is created here rather than by hand.
      - name: Create and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'daiku-release-bot'
          git config user.email 'daiku-release-bot@users.noreply.github.com'
          git tag -a "$VERSION" -m "daiku $VERSION"
          # The checkout does not persist credentials, so the token is supplied
          # for this push alone instead of being written into .git/config.
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/$VERSION"
      - name: Install pinned release tools
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install github.com/goreleaser/goreleaser/v2@2d07c80923ac8a85886544b5dfb40160aa9ba90b
          go install github.com/sigstore/cosign/v2/cmd/cosign@6a7abbf3ae7eb6949883a80c8f6007cc065d2dfb
          go install github.com/anchore/syft/cmd/syft@46522bcc5dff8b65b61a7cda1393abe515802306
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Create signed draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.version }}
        run: goreleaser release --clean
      # attest-build-provenance, not the generic attest action: the generic one
      # requires an explicit predicate-type, while this emits the SLSA build
      # provenance that the README documents verifying.
      - name: Attest archives, checksums, signatures, certificates, and SBOMs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums.txt.pem
            dist/*.spdx.sbom.json
