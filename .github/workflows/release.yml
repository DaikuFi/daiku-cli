name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prerelease version (for example v0.2.0-rc.1)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: draft-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate prerelease version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*-*) ;;
            *) echo 'version must be a v-prefixed prerelease (for example v0.2.0-rc.1)' >&2; exit 2 ;;
          esac
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned release tools
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install github.com/goreleaser/goreleaser/v2@v2.8.2
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.3
          go install github.com/anchore/syft/cmd/syft@v1.20.0
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Create signed draft prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.version }}
        run: goreleaser release --clean
